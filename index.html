<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wisdom Vault</title>
    <style>
        :root {
            --bg: #050505;
            --card: #111111;
            --accent: #bb86fc; /* Neon Emo Purple */
            --text: #e0e0e0;
            --dim: #777;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 1rem;
            letter-spacing: 5px;
            color: var(--accent);
            margin-top: 2rem;
            text-transform: uppercase;
            opacity: 0.7;
        }

        #display-box {
            background: var(--card);
            border: 1px solid #222;
            border-radius: 24px;
            padding: 30px;
            margin: 2rem 0;
            text-align: left;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            min-height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #wisdom-headline {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 20px;
            line-height: 1.2;
        }

        #wisdom-story {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text);
            white-space: pre-line;
        }

        button {
            background: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
            padding: 18px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button:active {
            background: var(--accent);
            color: #000;
            transform: scale(0.97);
        }

        .footer {
            margin-top: 3rem;
            font-size: 0.7rem;
            color: var(--dim);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Wisdom Vault</h1>

        <div id="display-box">
            <div id="wisdom-headline">TAP FOR THE TRUTH</div>
            <div id="wisdom-story">"The world doesn’t care if you stay stuck. It just means you’ll earn peanuts and struggle constantly."</div>
        </div>

        <button onclick="getWisdom()">Draw Lesson</button>

        <div class="footer">
            ST. STEPHEN // NO EXCUSES // 2026
        </div>
    </div>

    <script>
        const vault = [
            {
                title: "Risk-taking separates the living from the dead.",
                story: "By 35, the gap between risk-takers and safety-players is huge. Playing it safe leads to a future with zero accountability. If you're overthinking small purchases and procrastinating, you aren't living."
            },
            {
                title: "Kids are rocket fuel, not a ball and chain.",
                story: "People say your life is over when kids arrive. They're wrong. My 2-year-old takes time, but her smile fuels every creative pursuit. Choose your hard: the hardship of kids or the hardship of a meaningless life."
            },
            {
                title: "Chase obsession, not passion.",
                story: "Most people stay on beginner level because they are 'lukewarm.' Hardcore obsession saved me. It can save anyone. The world doesn't care if you're stuck; you have to obsess your way out."
            },
            {
                title: "The Surgeon vs. The Nice Guy.",
                story: "If a loved one is bleeding from a gunshot, you don't care if the person helping is 'honest' or 'on time'—you need a surgeon. Society is the victim. If you don't have a unique skill to stop the bleeding, the world will reject you."
            },
            {
                title: "Raise your standards to 'Psychopath' levels.",
                story: "People call you a psychopath to cope with their own mediocrity. High standards automate your life—suddenly you don't 'decide' to avoid junk food or alcohol; your standards do it for you."
            },
            {
                title: "The Conventional Path is a Boredom Trap.",
                story: "The standard path—degree, debt, marriage—leads to 'Mighty Melbourne' burger rage. If you can predict exactly what your week looks like, you're on the wrong path. Stop lying to yourself."
            },
            {
                title: "Emotional control is a sign of high IQ.",
                story: "Labels dumb us down. Life is nuanced and grey. If you can hear an opinion you hate without acting emotionally, you're winning. People you disagree with reveal parts of your ego you've hidden."
            },
            {
                title: "Ditch your loser friends.",
                story: "At 40, drinking out of a beer bong is one step from unemployment. As you grow, your circle must change. Don't be rude, just slowly reduce contact with those you no longer vibe with."
            },
            {
                title: "Hard things build mental muscle.",
                story: "An easy life is the default, and it feels like nothing. My upbringing was rough—crime and bankruptcy—but those challenges are now my biggest advantage. Doing hard things makes you successful."
            },
            {
                title: "The Corporate Ladder is a scam.",
                story: "Met guys 20 years ahead in the corporate world—none were happy. They get addicted to the status and can't leave. Get off the ladder and build something online where your income is uncapped."
            },
            {
                title: "Invest the 'Golden Hour' in yourself.",
                story: "If you have 8 hours for a boring job, you have 1 hour in the morning for yourself. The life you dream of is built before and after work. If you don't start now, you never will."
            },
            {
                title: "Stay in the 'Dark Place.'",
                story: "Breakups, divorce, and death are blessings if you use them. Don't leave the darkness right away. Let it break your old patterns so you can become someone new."
            },
            {
                title: "Maniacs have no competition.",
                story: "Met a guy who commented on X for 14 hours a day for a year. It sounds stupid, but he has zero competition because most people won't work that hard. Maniac strategies work when everything else fails."
            },
            {
                title: "Busyness is a death trap.",
                story: "Being 'busy' means your life is out of control and you have no focus. It’s a red flag. Treat a packed calendar as seriously as a health crisis. Make space for living."
            },
            {
                title: "The Power of being Quiet.",
                story: "Look at Keanu Reeves. Most people talk but never listen. You learn groundbreaking ideas when you have conversations where you don't talk at all."
            },
            {
                title: "Adopt a nickname and build without fear.",
                story: "Public life creates imposter syndrome. Use a nickname online. It removes the fear of judgment and the need for permission. Disappear and build something great."
            },
            {
                title: "Money is the scoreboard of accountability.",
                story: "People who say money doesn't matter are delusional. Money is a resource. Even charities need it. Be mature enough to admit it matters so you can change your financial future."
            },
            {
                title: "The Financial System is rigged by design.",
                story: "I worked in banking for a decade—it's worse than you think. Tax is the average person's biggest expense, but the rich pay zero. You must obsessively learn the game to escape working for money."
            },
            {
                title: "Read finance patterns, not just books.",
                story: "Don't buy treasury bonds like it's 1970. Read the patterns in popular finance books and the new blockchain system. Patterns repeat; once you see them, money becomes simple."
            },
            {
                title: "Dopamine is your most important health hack.",
                story: "If you're addicted to TikTok, Netflix, and video games, you'll always be unmotivated. Cut back on easy payoffs. How you invest your dopamine determines your success."
            },
            {
                title: "Eat like the strongest animals.",
                story: "The strongest animals eat plants. Without energy, you can't achieve anything. Eat in a way that maximizes your energy, not your taste buds for one moment."
            },
            {
                title: "Turn off the News to raise your IQ.",
                story: "News and politics are designed to keep you emotional and small-minded. Turn them off and watch your clarity and intelligence naturally increase."
            },
            {
                title: "Writing online is the ultimate permission-slip.",
                story: "Writing attracts opportunities. It's the easiest way to stop asking for a job or a break and start creating your own world."
            },
            {
                title: "The Bitcoin Standard.",
                story: "Buy Bitcoin before the major governments do. Understand the shift from the old financial system to the blockchain-based one."
            },
            {
                title: "City for networking, Suburbs for saving.",
                story: "Live where the action is while you're young to build your network. Move to the outer suburbs as you get older to reduce debt and save your capital."
            },
            {
                title: "Embrace self-driving and electric tech.",
                story: "Get an electric self-driving car. Stop wasting energy on the old ways of moving. Efficiency is a competitive advantage."
            },
            {
                title: "Exercise in nature to stay young.",
                story: "Exercise every single day, preferably outside. It keeps your body and mind younger for much longer than any 'hack' or supplement."
            },
            {
                title: "Alcohol is a scam.",
                story: "It steals your energy, ruins your sleep, and leads to bad decisions with strangers. Give it up to keep your edge."
            },
            {
                title: "Video games are for the young.",
                story: "They're fine when you're a kid, but as you get older, they become a massive time-suck that steals your potential. Real life is the ultimate game."
            },
            {
                title: "Spend time with your parents now.",
                story: "Spend more time with them than feels 'normal.' Soon they'll be gone. Don't wait until it's too late to appreciate the connection."
            },
            {
                title: "Visit a retirement home.",
                story: "Go see what dying feels like. Use that proximity to death as the ultimate motivation to live fully while you still can."
            },
            {
                title: "Flow states over Productivity.",
                story: "To-do lists are boring. Flow states—where 8 hours feel like 1—are where the real work happens. Work fewer hours, but make them 'flow' hours."
            },
            {
                title: "Light your parents' plan on fire.",
                story: "The world moves too fast for their old rules to work. AI has broken the game. Carve your own path; it feels better to be self-made."
            },
            {
                title: "Be wary of religious cults.",
                story: "I got trapped in one that used God to extract money. It's too easy for religion to turn into manipulation. Be extremely careful or just opt out."
            },
            {
                title: "Solopreneurship is the 'Real World'.",
                story: "Corporations are daycare centers that pretend to care until the next layoff. Transcend to the real world through building your own thing as fast as possible."
            },
            {
                title: "Unicorn startups are a fantasy.",
                story: "Don't chase VC money and fake revenue projections. The best businesses today are bootstrapped, profitable, and built using free social media and email lists."
            },
            {
                title: "Master Psychology to master Money.",
                story: "Business and life are just psychology masterclasses. Humans act out of self-interest. If you learn to appeal to that, you can have anything you want."
            }
        ];

        function getWisdom() {
            const displayBox = document.getElementById('display-box');
            const headline = document.getElementById('wisdom-headline');
            const story = document.getElementById('wisdom-story');
            
            // Fade out
            displayBox.style.opacity = 0;
            
            setTimeout(() => {
                const random = vault[Math.floor(Math.random() * vault.length)];
                headline.innerText = random.title;
                story.innerText = random.story;
                // Fade in
                displayBox.style.opacity = 1;
            }, 250);
        }

        // Add smooth transition style via JS
        document.getElementById('display-box').style.transition = "opacity 0.25s ease-in-out";
    </script>
</body>
</html>
